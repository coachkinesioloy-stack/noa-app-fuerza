<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
<title id="title">NOAH — isotipo</title><desc id="desc">Isotipo geométrico tridimensional facetado en azul petróleo, teal y cyan.</desc>
<defs>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087F91"/><stop offset="1" stop-color="#00566B"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#35E7ED"/><stop offset="1" stop-color="#00AEB5"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00C5C3"/><stop offset="1" stop-color="#007C88"/></linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#063D50"/><stop offset="1" stop-color="#071F2D"/></linearGradient>
</defs>
<!-- upper crown -->
<polygon points="120,8 190,49 120,91 50,49" fill="url(#top)"/>
<polygon points="50,49 120,91 120,135 50,94" fill="#06495A"/>
<polygon points="190,49 120,91 120,135 190,94" fill="#087D8B"/>
<!-- left and right outer facets -->
<polygon points="50,49 50,145 83,164 83,111" fill="url(#teal)"/>
<polygon points="50,49 83,111 120,91" fill="url(#cyan)"/>
<polygon points="190,49 190,145 157,164 157,111" fill="url(#cyan)"/>
<polygon points="190,49 157,111 120,91" fill="#00AEB7"/>
<!-- lower facets, central negative N channel is intentionally left open -->
<polygon points="50,145 120,186 120,232 50,191" fill="url(#teal)"/>
<polygon points="190,145 120,186 120,232 190,191" fill="url(#navy)"/>
<polygon points="83,111 120,91 157,111 157,164 120,143 83,164" fill="#FFFFFF"/>
<polygon points="83,164 120,143 157,164 120,186" fill="#07394A"/>
<polygon points="83,164 120,186 120,232 83,211" fill="#0A3040"/>
<polygon points="157,164 120,143 120,186 157,211" fill="#061F2C"/>
</svg>